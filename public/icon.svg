<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Clean Khodam Logo: Dark Green #0A4D2E & White -->
  <rect width="512" height="512" rx="48" ry="48" fill="#0A4D2E" />
  
  <!-- Subtle 1px inner hairline border -->
  <rect x="4" y="4" width="504" height="504" rx="44" ry="44" fill="none" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" />
  
  <!-- Geometric Symbol: Hexagonal / Clipped Corner Shield with Wrench-Checkmark -->
  <g transform="translate(156, 90)">
    <!-- Clipped Corner Square / Shield -->
    <path 
      d="M 20 0 L 160 0 L 200 40 L 200 180 L 20 180 C 9 180 0 171 0 160 L 0 20 C 0 9 9 0 20 0 Z" 
      fill="#0F6B3F" 
      stroke="#1E9B5C" 
      stroke-width="3"
    />
    
    <!-- Stylized Wrench + Checkmark in Clean White -->
    <!-- Wrench head & handle forming the dynamic checkmark -->
    <path 
      d="M 52 92 L 84 124 L 152 56 L 166 70 L 84 152 L 38 106 Z" 
      fill="#FFFFFF" 
    />
    <!-- Wrench jaw notch inside the checkmark stem -->
    <circle cx="146" cy="64" r="8" fill="#0F6B3F" />
  </g>

  <!-- Wordmark "خدام" in clean bold Arabic typography -->
  <text 
    x="256" 
    y="380" 
    text-anchor="middle" 
    font-family="'Cairo', 'Tajawal', sans-serif" 
    font-size="88" 
    font-weight="700" 
    fill="#FFFFFF" 
    letter-spacing="-1"
  >خـدّام</text>

  <!-- Clean Subtitle: حرفيك قريب منك -->
  <text 
    x="256" 
    y="428" 
    text-anchor="middle" 
    font-family="'Cairo', 'Tajawal', sans-serif" 
    font-size="24" 
    font-weight="600" 
    fill="#EEF6F1" 
    opacity="0.9"
  >حرفيك قريب منك</text>
</svg>