<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Luxury Navy Blue -->
    <linearGradient id="bg_gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#12254e" />
      <stop offset="60%" stop-color="#0c1935" />
      <stop offset="100%" stop-color="#070f20" />
    </linearGradient>

    <!-- Orange Gradient: Vivid Amber / Orange for Gear & Wrench -->
    <linearGradient id="orange_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="40%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- White Letter Gradient with subtle 3D lighting -->
    <linearGradient id="white_gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="85%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="icon_shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#020617" flood-opacity="0.5" />
    </filter>
    
    <filter id="element_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#020617" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 1. App Icon Rounded Squircle Container -->
  <rect width="512" height="512" rx="114" ry="114" fill="url(#bg_gradient)" />
  
  <!-- Subtle Inner Top Highlight -->
  <rect x="6" y="6" width="500" height="500" rx="108" ry="108" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="3" />

  <!-- Main Emblem Group with Shadow -->
  <g filter="url(#icon_shadow)">
    <!-- 2. Orange Gear (الترس البرتقالي في الأعلى) -->
    <g fill="url(#orange_gradient)" filter="url(#element_shadow)">
      <!-- Gear Center Arch & Teeth -->
      <path d="
        M 215 190
        A 54 54 0 0 1 315 190
        L 315 210
        L 215 210
        Z
      " />
      <!-- Radial Cog Teeth -->
      <!-- Tooth 1 (left) -->
      <polygon points="214,192 226,160 240,165 230,195" />
      <!-- Tooth 2 (mid-left) -->
      <polygon points="234,166 250,150 264,150 256,168" />
      <!-- Tooth 3 (top) -->
      <polygon points="260,165 272,148 288,150 282,168" />
      <!-- Tooth 4 (mid-right) -->
      <polygon points="284,170 304,160 316,170 300,182" />
      <!-- Tooth 5 (right) -->
      <polygon points="300,182 322,185 320,202 296,196" />
      <!-- Inner cutout to give hollow gear look -->
      <circle cx="265" cy="195" r="24" fill="url(#bg_gradient)" />
    </g>

    <!-- 3. Stylized Arabic Letter "ح / خ" (الخط العربي الأبيض المصقول) -->
    <path
      d="
        M 190 206
        C 192 196 205 194 220 196
        C 255 200 295 218 322 224
        L 316 250
        C 290 244 260 236 238 234
        C 215 240 190 265 186 295
        C 182 325 200 350 230 355
        C 246 358 260 354 270 348
        C 264 344 246 340 236 332
        C 214 316 210 286 226 264
        C 238 248 262 242 284 242
        L 288 226
        C 250 220 216 208 190 206
        Z
      "
      fill="url(#white_gradient)"
      filter="url(#element_shadow)"
    />

    <!-- Upper Serif / Hook of letter -->
    <path
      d="
        M 190 206
        C 184 212 188 228 206 230
        C 214 231 222 226 224 218
        C 216 214 204 210 190 206
        Z
      "
      fill="url(#white_gradient)"
    />

    <!-- 4. Orange Wrench (مفتاح الربط البرتقالي الملتف في الأسفل نحو اليمين) -->
    <g fill="url(#orange_gradient)" filter="url(#element_shadow)">
      <!-- Smooth sweeping handle curving under the belly of the letter -->
      <path
        d="
          M 178 290
          C 176 332 205 372 254 378
          C 292 382 328 358 352 326
          L 332 312
          C 314 336 286 352 255 348
          C 218 344 198 316 198 285
          C 198 280 188 278 182 282
          Z
        "
      />
      <!-- Wrench Jaw Head pointing upwards at the right (مقبض ورأس مفتاح الشد) -->
      <path
        d="
          M 342 320
          L 364 286
          C 368 280 376 276 384 282
          L 394 290
          C 400 295 400 304 394 312
          L 374 340
          C 368 348 356 348 348 342
          L 336 332
          C 330 326 334 322 342 320
          Z
        "
      />
      <!-- Wrench Inner Notch Cutout (فتحة المفتاح الدقيقة) -->
      <path
        d="
          M 364 296
          L 384 316
          L 372 332
          L 352 312
          Z
        "
        fill="url(#bg_gradient)"
      />
    </g>
  </g>
</svg>